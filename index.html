<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDFSwift — Browser-Native Document Studio</title>
  
  <!-- Swiss Editorial Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Client-Side Processing Libraries (100% Local Execution) -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

  <style>
    :root {
      --bg: #F9F9F8;
      --surface: #FFFFFF;
      --ink: #111111;
      --ink-muted: #5C5C5C;
      --border: #E2E2DF;
      --border-strong: #111111;
      --accent: #E63946; /* Swiss International Red */
      --accent-hover: #C92A37;
      --badge-bg: #F0F0EE;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Swiss Grid Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
    }

    .brand h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .brand span {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 500;
    }

    .privacy-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      background: var(--badge-bg);
      padding: 0.4rem 0.75rem;
      border-radius: 4px;
      color: var(--ink);
    }

    .privacy-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #16A34A;
    }

    /* Main Workspace Layout */
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: calc(100vh - 65px);
    }

    /* Sidebar Tool Navigation */
    aside {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 1.5rem 1rem;
      overflow-y: auto;
    }

    .workflow-group {
      margin-bottom: 1.75rem;
    }

    .workflow-title {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      padding: 0 0.75rem 0.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.5rem;
    }

    .tool-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-sans);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--ink);
      transition: all 0.15s ease;
    }

    .tool-btn:hover {
      background: var(--badge-bg);
    }

    .tool-btn.active {
      background: var(--ink);
      color: var(--surface);
    }

    .tool-ext {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      opacity: 0.7;
    }

    /* Main Stage */
    main {
      padding: 2.5rem 3rem;
      max-width: 1040px;
      width: 100%;
    }

    .tool-header {
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.25rem;
    }

    .tool-header h2 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.35rem;
    }

    .tool-header p {
      color: var(--ink-muted);
      font-size: 0.95rem;
    }

    /* Dropzone */
    .dropzone {
      background: var(--surface);
      border: 1.5px dashed var(--border-strong);
      border-radius: 8px;
      padding: 3.5rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .dropzone:hover, .dropzone.dragover {
      background: #F3F3F1;
      border-color: var(--accent);
    }

    .dropzone h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }

    .dropzone p {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--ink-muted);
    }

    /* Smart Format Switcher Banner */
    .smart-alert {
      display: none;
      margin-top: 1.25rem;
      background: #FFF5F5;
      border: 1px solid var(--accent);
      padding: 1rem 1.25rem;
      border-radius: 6px;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .smart-alert.visible {
      display: flex;
    }

    .smart-alert-text {
      font-size: 0.88rem;
    }

    /* Controls Bar */
    .controls-panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-top: 1.5rem;
      gap: 1.25rem;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .controls-panel.visible {
      display: flex;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      min-width: 160px;
    }

    .control-group label {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    select, input[type="text"], input[type="number"] {
      font-family: var(--font-sans);
      font-size: 0.875rem;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--bg);
      color: var(--ink);
    }

    /* File Queue & Thumbnail Grid */
    .file-queue {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .file-item {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.75rem 1rem;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
    }

    .file-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .file-badge {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      background: var(--badge-bg);
      padding: 0.2rem 0.45rem;
      border-radius: 3px;
    }

    .thumbnail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .page-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }

    .page-card img {
      width: 100%;
      height: auto;
      display: block;
      border: 1px solid #EEE;
    }

    .page-card .page-num {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      margin-top: 0.4rem;
      color: var(--ink-muted);
    }

    .page-card.selected-remove {
      border-color: var(--accent);
      background: #FFF5F5;
    }

    .page-card.selected-remove::after {
      content: "REMOVE";
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--accent);
      color: white;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .page-card.selected-extract {
      border-color: #16A34A;
      background: #F0FDF4;
    }

    .page-card.selected-extract::after {
      content: "KEEP";
      position: absolute;
      top: 8px;
      right: 8px;
      background: #16A34A;
      color: white;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 3px;
    }

    /* Buttons */
    .btn {
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.65rem 1.25rem;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--ink);
      color: white;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--ink);
      padding: 0.35rem 0.65rem;
      font-size: 0.78rem;
    }

    .action-bar {
      margin-top: 1.75rem;
      display: none;
      align-items: center;
      gap: 1rem;
    }

    .action-bar.visible {
      display: flex;
    }

    #status-log {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--ink-muted);
    }

    /* Table Preview for PDF to Excel / Excel to PDF */
    .preview-table-wrap {
      margin-top: 1.5rem;
      overflow-x: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      max-height: 320px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 0.5rem 0.75rem;
      text-align: left;
    }

    th {
      background: var(--badge-bg);
      font-family: var(--font-mono);
      font-size: 0.75rem;
    }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      aside { border-right: none; border-bottom: 1px solid var(--border); }
      main { padding: 1.5rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>PDFSwift</h1>
      <span>12-in-1 Studio</span>
    </div>
    <div class="privacy-pill">
      <span class="privacy-dot"></span>
      100% Browser-Native • Zero Server Uploads
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar"></aside>

    <main>
      <div class="tool-header">
        <h2 id="tool-title">Images to PDF</h2>
        <p id="tool-desc">Combine JPG, PNG, WEBP, and SVG files into a single multi-page PDF document.</p>
      </div>

      <!-- Dropzone -->
      <div class="dropzone" id="dropzone">
        <input type="file" id="file-input" hidden multiple />
        <h3>Drop files here or click to browse</h3>
        <p id="accepted-hint">Accepted formats: .jpg, .jpeg, .png, .webp, .svg</p>
      </div>

      <!-- Smart Format Detection Banner -->
      <div class="smart-alert" id="smart-alert">
        <div class="smart-alert-text" id="smart-alert-text"></div>
        <button class="btn btn-secondary" id="smart-switch-btn">Switch Tool</button>
      </div>

      <!-- Dynamic Tool Options -->
      <div class="controls-panel" id="controls-panel"></div>

      <!-- File List Queue -->
      <div class="file-queue" id="file-queue"></div>

      <!-- Live Visual Page Inspection Grid (Remove / Extract Pages) -->
      <div class="thumbnail-grid" id="thumbnail-grid"></div>

      <!-- Live Table Preview (PDF to Excel / Excel to PDF) -->
      <div id="preview-container"></div>

      <!-- Action Bar -->
      <div class="action-bar" id="action-bar">
        <button class="btn btn-primary" id="process-btn">Convert & Download</button>
        <button class="btn btn-ghost" id="clear-btn">Clear Files</button>
        <span id="status-log"></span>
      </div>
    </main>
  </div>

  <script>
    // Configure PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // All 12 PDFSwift Tools Configuration
    const TOOLS = [
      // A. Convert to PDF
      {
        id: 'img-to-pdf',
        category: 'A. Convert to PDF',
        name: 'Images to PDF',
        extBadge: 'IMG → PDF',
        accept: '.jpg,.jpeg,.png,.webp,.svg',
        extensions: ['jpg', 'jpeg', 'png', 'webp', 'svg'],
        multiple: true,
        desc: 'Combine JPG, PNG, WEBP, and SVG images into a single clean, multi-page PDF document.',
        controls: `
          <div class="control-group">
            <label>Page Size</label>
            <select id="opt-pagesize">
              <option value="fit">Fit Image</option>
              <option value="a4">A4 (210 × 297 mm)</option>
              <option value="letter">US Letter</option>
            </select>
          </div>
          <div class="control-group">
            <label>Margins</label>
            <select id="opt-margin">
              <option value="0">None (0px)</option>
              <option value="20" selected>Compact (20px)</option>
              <option value="48">Standard (48px)</option>
            </select>
          </div>
        `
      },
      {
        id: 'word-to-pdf',
        category: 'A. Convert to PDF',
        name: 'Word to PDF',
        extBadge: 'DOCX → PDF',
        accept: '.docx',
        extensions: ['docx'],
        multiple: false,
        desc: 'Convert Microsoft Word (.docx) files into clean vector-text PDFs preserving headings, lists, and paragraphs.',
        controls: ''
      },
      {
        id: 'excel-to-pdf',
        category: 'A. Convert to PDF',
        name: 'Excel to PDF',
        extBadge: 'XLSX → PDF',
        accept: '.xlsx,.xls,.csv',
        extensions: ['xlsx', 'xls', 'csv'],
        multiple: false,
        desc: 'Render multi-sheet Excel workbooks and CSV files into neatly formatted, paginated PDF tables.',
        controls: `
          <div class="control-group">
            <label>Orientation</label>
            <select id="opt-orientation">
              <option value="landscape">Landscape (Wide Sheets)</option>
              <option value="portrait">Portrait (Compact Lists)</option>
            </select>
          </div>
        `
      },
      {
        id: 'ppt-to-pdf',
        category: 'A. Convert to PDF',
        name: 'PowerPoint to PDF',
        extBadge: 'PPTX → PDF',
        accept: '.pptx',
        extensions: ['pptx'],
        multiple: false,
        desc: 'Parse PowerPoint (.pptx) decks directly in the browser and export a presentation-ready PDF.',
        controls: ''
      },

      // B. Convert from PDF
      {
        id: 'pdf-to-img',
        category: 'B. Convert from PDF',
        name: 'PDF to JPG / Images',
        extBadge: 'PDF → IMG',
        accept: '.pdf',
        extensions: ['pdf'],
        multiple: false,
        desc: 'Render PDF pages into crisp raster images with custom DPI and ZIP bundling.',
        controls: `
          <div class="control-group">
            <label>Output Format</label>
            <select id="opt-img-format">
              <option value="image/jpeg">JPG (Compact)</option>
              <option value="image/png">PNG (Lossless)</option>
              <option value="image/webp">WEBP (Modern Web)</option>
            </select>
          </div>
          <div class="control-group">
            <label>Resolution</label>
            <select id="opt-dpi">
              <option value="2.08">150 DPI (Screen/Web)</option>
              <option value="3.05" selected>220 DPI (Balanced)</option>
              <option value="4.16">300 DPI (Print-Grade)</option>
            </select>
          </div>
          <div class="control-group">
            <label>Page Filter (Optional)</label>
            <input type="text" id="opt-page-filter" placeholder="e.g. 1-3, 5 (or blank for all)" />
          </div>
        `
      },
      {
        id: 'pdf-to-word',
        category: 'B. Convert from PDF',
        name: 'PDF to Word',
        extBadge: 'PDF → DOCX',
        accept: '.pdf',
        extensions: ['pdf'],
        multiple: false,
        desc: 'Extract structured text into an editable Microsoft Word (.docx) file, with automatic image fallback for scanned pages.',
        controls: ''
      },
      {
        id: 'pdf-to-excel',
        category: 'B. Convert from PDF',
        name: 'PDF to Excel',
        extBadge: 'PDF → XLSX',
        accept: '.pdf',
        extensions: ['pdf'],
        multiple: false,
        desc: 'Analyze X/Y text coordinates on PDF pages to reconstruct rows and columns into a multi-sheet .xlsx workbook.',
        controls: ''
      },
      {
        id: 'pdf-to-ppt',
        category: 'B. Convert from PDF',
        name: 'PDF to PowerPoint',
        extBadge: 'PDF → PPTX',
        accept: '.pdf',
        extensions: ['pdf'],
        multiple: false,
        desc: 'Convert PDF pages into an editable PowerPoint (.pptx) presentation deck matched to original aspect ratios.',
        controls: ''
      },

      // C. Organize & Edit PDFs
      {
        id: 'merge-pdf',
        category: 'C. Organize & Edit PDFs',
        name: 'Merge PDFs',
        extBadge: 'MERGE',
        accept: '.pdf',
        extensions: ['pdf'],
        multiple: true,
        desc: 'Combine two or more PDF files into one unified document. Reorder files before merging.',
        controls: ''
      },
      {
        id: 'split-pdf',
        category: 'C. Organize & Edit PDFs',
        name: 'Split PDF',
        extBadge: 'SPLIT',
        accept: '.pdf',
        extensions: ['pdf'],
        multiple: false,
        desc: 'Break large PDFs into smaller documents by every page, fixed intervals, or custom ranges.',
        controls: `
          <div class="control-group">
            <label>Split Mode</label>
            <select id="opt-split-mode">
              <option value="every">Every Page (1 PDF per page)</option>
              <option value="interval">Fixed Interval (Every N pages)</option>
              <option value="ranges">Custom Ranges (e.g. 1-3, 4-6)</option>
            </select>
          </div>
          <div class="control-group">
            <label>Interval / Ranges</label>
            <input type="text" id="opt-split-param" placeholder="e.g. 2 or 1-3, 4-8" />
          </div>
        `
      },
      {
        id: 'remove-pages',
        category: 'C. Organize & Edit PDFs',
        name: 'Remove Pages',
        extBadge: 'DELETE',
        accept: '.pdf',
        extensions: ['pdf'],
        multiple: false,
        desc: 'Click visual thumbnails below to mark pages for deletion and download the cleaned PDF.',
        controls: `
          <div class="control-group">
            <label>Quick Selectors</label>
            <div style="display:flex; gap:0.4rem;">
              <button type="button" class="btn btn-ghost" onclick="selectOddEven('odd')">Odd Pages</button>
              <button type="button" class="btn btn-ghost" onclick="selectOddEven('even')">Even Pages</button>
            </div>
          </div>
        `
      },
      {
        id: 'extract-pages',
        category: 'C. Organize & Edit PDFs',
        name: 'Extract Pages',
        extBadge: 'EXTRACT',
        accept: '.pdf',
        extensions: ['pdf'],
        multiple: false,
        desc: 'Pick exact pages from visual thumbnails and export as one combined PDF or individual files in a ZIP.',
        controls: `
          <div class="control-group">
            <label>Export Format</label>
            <select id="opt-extract-mode">
              <option value="combined">One Combined PDF</option>
              <option value="zip">Separate PDFs (ZIP Archive)</option>
            </select>
          </div>
        `
      }
    ];

    let activeTool = TOOLS[0];
    let uploadedFiles = [];
    let selectedPageIndices = new Set();
    let totalPdfPages = 0;

    // Initialize Sidebar
    function renderSidebar() {
      const sidebar = document.getElementById('sidebar');
      const categories = [...new Set(TOOLS.map(t => t.category))];
      sidebar.innerHTML = categories.map(cat => `
        <div class="workflow-group">
          <div class="workflow-title">${cat}</div>
          ${TOOLS.filter(t => t.category === cat).map(tool => `
            <button class="tool-btn ${tool.id === activeTool.id ? 'active' : ''}" onclick="switchTool('${tool.id}')">
              <span>${tool.name}</span>
              <span class="tool-ext">${tool.extBadge}</span>
            </button>
          `).join('')}
        </div>
      `).join('');
    }

    // Switch Active Tool
    function switchTool(toolId) {
      activeTool = TOOLS.find(t => t.id === toolId);
      uploadedFiles = [];
      selectedPageIndices.clear();
      totalPdfPages = 0;

      document.getElementById('tool-title').textContent = activeTool.name;
      document.getElementById('tool-desc').textContent = activeTool.desc;
      document.getElementById('accepted-hint').textContent = `Accepted formats: ${activeTool.accept}`;
      
      const fileInput = document.getElementById('file-input');
      fileInput.accept = activeTool.accept;
      fileInput.multiple = activeTool.multiple;
      fileInput.value = '';

      const controlsPanel = document.getElementById('controls-panel');
      controlsPanel.innerHTML = activeTool.controls;
      controlsPanel.classList.toggle('visible', activeTool.controls.trim().length > 0);

      document.getElementById('smart-alert').classList.remove('visible');
      document.getElementById('file-queue').innerHTML = '';
      document.getElementById('thumbnail-grid').innerHTML = '';
      document.getElementById('preview-container').innerHTML = '';
      document.getElementById('action-bar').classList.remove('visible');
      document.getElementById('status-log').textContent = '';

      renderSidebar();
    }

    // Drag & Drop + File Input Handlers
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', e => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      handleFiles(Array.from(e.dataTransfer.files));
    });
    fileInput.addEventListener('change', e => handleFiles(Array.from(e.target.files)));

    // Smart Format Detection & File Queueing
    async function handleFiles(files) {
      if (!files.length) return;
      const alertBox = document.getElementById('smart-alert');
      alertBox.classList.remove('visible');

      const firstExt = files[0].name.split('.').pop().toLowerCase();

      // Check if file matches active tool
      if (!activeTool.extensions.includes(firstExt)) {
        const suggestedTool = TOOLS.find(t => t.extensions.includes(firstExt));
        if (suggestedTool) {
          document.getElementById('smart-alert-text').innerHTML = 
            `You dropped a <strong>.${firstExt.toUpperCase()}</strong> file, but you're currently in <strong>${activeTool.name}</strong>.`;
          const switchBtn = document.getElementById('smart-switch-btn');
          switchBtn.textContent = `Switch to ${suggestedTool.name}`;
          switchBtn.onclick = () => {
            switchTool(suggestedTool.id);
            handleFiles(files);
          };
          alertBox.classList.add('visible');
        } else {
          alert(`Unsupported file extension: .${firstExt}`);
        }
        return;
      }

      if (activeTool.multiple) {
        uploadedFiles.push(...files);
      } else {
        uploadedFiles = [files[0]];
      }

      renderFileQueue();
      document.getElementById('action-bar').classList.add('visible');

      // Trigger Live Visual Inspection for Remove/Extract Pages
      if (activeTool.id === 'remove-pages' || activeTool.id === 'extract-pages') {
        await renderPdfThumbnails(uploadedFiles[0]);
      }

      // Trigger Live Coordinate Table Preview for PDF to Excel or Excel to PDF
      if (activeTool.id === 'pdf-to-excel') {
        await previewPdfTable(uploadedFiles[0]);
      } else if (activeTool.id === 'excel-to-pdf') {
        await previewExcelTable(uploadedFiles[0]);
      }
    }

    function renderFileQueue() {
      const queue = document.getElementById('file-queue');
      queue.innerHTML = uploadedFiles.map((file, idx) => `
        <div class="file-item">
          <div class="file-meta">
            <span class="file-badge">${idx + 1}</span>
            <strong>${file.name}</strong>
            <span style="color:var(--ink-muted); font-size:0.78rem;">(${(file.size / 1024).toFixed(1)} KB)</span>
          </div>
          <div style="display:flex; gap:0.35rem;">
            ${uploadedFiles.length > 1 && idx > 0 ? `<button class="btn btn-ghost" onclick="moveFile(${idx}, -1)">↑</button>` : ''}
            ${uploadedFiles.length > 1 && idx < uploadedFiles.length - 1 ? `<button class="btn btn-ghost" onclick="moveFile(${idx}, 1)">↓</button>` : ''}
            <button class="btn btn-ghost" onclick="removeFile(${idx})">✕</button>
          </div>
        </div>
      `).join('');
    }

    function moveFile(index, dir) {
      const target = index + dir;
      [uploadedFiles[index], uploadedFiles[target]] = [uploadedFiles[target], uploadedFiles[index]];
      renderFileQueue();
    }

    function removeFile(index) {
      uploadedFiles.splice(index, 1);
      renderFileQueue();
      if (!uploadedFiles.length) {
        document.getElementById('action-bar').classList.remove('visible');
        document.getElementById('thumbnail-grid').innerHTML = '';
        document.getElementById('preview-container').innerHTML = '';
      }
    }

    document.getElementById('clear-btn').addEventListener('click', () => switchTool(activeTool.id));

    // Render Live Page Thumbnails for Remove/Extract Pages
    async function renderPdfThumbnails(file) {
      const grid = document.getElementById('thumbnail-grid');
      grid.innerHTML = '<p style="font-family:var(--font-mono);font-size:0.8rem;">Rendering page previews locally...</p>';
      selectedPageIndices.clear();

      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      totalPdfPages = pdf.numPages;
      grid.innerHTML = '';

      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 0.35 });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

        const card = document.createElement('div');
        card.className = 'page-card';
        card.dataset.page = i;
        card.innerHTML = `<img src="${canvas.toDataURL()}" /><div class="page-num">Page ${i}</div>`;
        card.onclick = () => togglePageSelection(i, card);
        grid.appendChild(card);
      }
    }

    function togglePageSelection(pageNum, cardEl) {
      const cssClass = activeTool.id === 'remove-pages' ? 'selected-remove' : 'selected-extract';
      if (selectedPageIndices.has(pageNum)) {
        selectedPageIndices.delete(pageNum);
        cardEl.classList.remove(cssClass);
      } else {
        selectedPageIndices.add(pageNum);
        cardEl.classList.add(cssClass);
      }
    }

    function selectOddEven(type) {
      document.querySelectorAll('.page-card').forEach(card => {
        const p = parseInt(card.dataset.page, 10);
        const match = type === 'odd' ? p % 2 !== 0 : p % 2 === 0;
        if (match) {
          selectedPageIndices.add(p);
          card.classList.add('selected-remove');
        } else {
          selectedPageIndices.delete(p);
          card.classList.remove('selected-remove');
        }
      });
    }

    // Parse Range Strings like "1-3, 5"
    function parsePageRanges(input, maxPages) {
      if (!input || !input.trim()) return Array.from({ length: maxPages }, (_, i) => i + 1);
      const pages = new Set();
      input.split(',').forEach(part => {
        const [start, end] = part.trim().split('-').map(Number);
        if (start && end) {
          for (let i = Math.max(1, start); i <= Math.min(maxPages, end); i++) pages.add(i);
        } else if (start >= 1 && start <= maxPages) {
          pages.add(start);
        }
      });
      return Array.from(pages).sort((a, b) => a - b);
    }

    // Extract X/Y Coordinates into Rows for PDF -> Excel
    async function extractRowsFromPdf(file) {
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      const sheets = [];

      for (let p = 1; p <= pdf.numPages; p++) {
        const page = await pdf.getPage(p);
        const content = await page.getTextContent();
        const rowsMap = {};

        content.items.forEach(item => {
          const y = Math.round(item.transform[5] / 5) * 5; // Group items within 5pt vertical tolerance
          if (!rowsMap[y]) rowsMap[y] = [];
          rowsMap[y].push({ x: item.transform[4], text: item.str.trim() });
        });

        const sortedYs = Object.keys(rowsMap).map(Number).sort((a, b) => b - a);
        const matrix = sortedYs.map(y =>
          rowsMap[y].sort((a, b) => a.x - b.x).map(cell => cell.text).filter(Boolean)
        ).filter(r => r.length > 0);

        sheets.push({ name: `Page_${p}`, rows: matrix });
      }
      return sheets;
    }

    async function previewPdfTable(file) {
      const sheets = await extractRowsFromPdf(file);
      const firstRows = sheets[0]?.rows.slice(0, 12) || [];
      renderTablePreview(firstRows, 'Live Extracted Table Preview (Page 1)');
    }

    async function previewExcelTable(file) {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const firstSheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 }).slice(0, 12);
      renderTablePreview(rows, `Sheet Preview: ${wb.SheetNames[0]}`);
    }

    function renderTablePreview(rows, caption) {
      const container = document.getElementById('preview-container');
      if (!rows.length) return;
      container.innerHTML = `
        <div style="margin-top:1.5rem; font-family:var(--font-mono); font-size:0.75rem; color:var(--ink-muted);">${caption}</div>
        <div class="preview-table-wrap">
          <table>
            <tbody>
              ${rows.map(r => `<tr>${r.map(c => `<td>${c ?? ''}</td>`).join('')}</tr>`).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // Download Helper
    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    // Convert any image (including WEBP/SVG) to PNG bytes via Canvas
    function imageFileToPngBytes(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth || 800;
          canvas.height = img.naturalHeight || 600;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(url);
          canvas.toBlob(async blob => {
            resolve({ bytes: await blob.arrayBuffer(), width: canvas.width, height: canvas.height });
          }, 'image/png');
        };
        img.onerror = reject;
        img.src = url;
      });
    }

    // Core Execution Engine for All 12 Tools
    document.getElementById('process-btn').addEventListener('click', async () => {
      const log = document.getElementById('status-log');
      log.textContent = 'Processing locally in browser...';

      try {
        const { PDFDocument, StandardFonts, rgb } = PDFLib;

        // 1. IMAGES TO PDF
        if (activeTool.id === 'img-to-pdf') {
          const pdfDoc = await PDFDocument.create();
          const pageSizeOpt = document.getElementById('opt-pagesize').value;
          const margin = parseInt(document.getElementById('opt-margin').value, 10);

          for (const file of uploadedFiles) {
            const { bytes, width, height } = await imageFileToPngBytes(file);
            const pngImage = await pdfDoc.embedPng(bytes);

            let pageW = width + margin * 2;
            let pageH = height + margin * 2;
            if (pageSizeOpt === 'a4') { pageW = 595.28; pageH = 841.89; }
            if (pageSizeOpt === 'letter') { pageW = 612; pageH = 792; }

            const page = pdfDoc.addPage([pageW, pageH]);
            const availW = pageW - margin * 2;
            const availH = pageH - margin * 2;
            const scale = Math.min(availW / width, availH / height, 1);

            const drawW = width * scale;
            const drawH = height * scale;
            page.drawImage(pngImage, {
              x: (pageW - drawW) / 2,
              y: (pageH - drawH) / 2,
              width: drawW,
              height: drawH
            });
          }
          const pdfBytes = await pdfDoc.save();
          triggerDownload(new Blob([pdfBytes], { type: 'application/pdf' }), 'PDFSwift_Images.pdf');
        }

        // 2. WORD TO PDF
        else if (activeTool.id === 'word-to-pdf') {
          const buf = await uploadedFiles[0].arrayBuffer();
          const result = await mammoth.extractRawText({ arrayBuffer: buf });
          const pdfDoc = await PDFDocument.create();
          const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
          const lines = result.value.split('\n');
          
          let page = pdfDoc.addPage([595.28, 841.89]);
          let y = 790;
          for (const line of lines) {
            if (y < 50) { page = pdfDoc.addPage([595.28, 841.89]); y = 790; }
            page.drawText(line.slice(0, 95), { x: 50, y, size: 11, font, color: rgb(0.1, 0.1, 0.1) });
            y -= 16;
          }
          triggerDownload(new Blob([await pdfDoc.save()], { type: 'application/pdf' }), 'PDFSwift_Document.pdf');
        }

        // 3. EXCEL TO PDF
        else if (activeTool.id === 'excel-to-pdf') {
          const buf = await uploadedFiles[0].arrayBuffer();
          const wb = XLSX.read(buf, { type: 'array' });
          const isLandscape = document.getElementById('opt-orientation').value === 'landscape';
          const dims = isLandscape ? [841.89, 595.28] : [595.28, 841.89];

          const pdfDoc = await PDFDocument.create();
          const font = await pdfDoc.embedFont(StandardFonts.Courier);

          wb.SheetNames.forEach(sheetName => {
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1 });
            let page = pdfDoc.addPage(dims);
            let y = dims[1] - 45;
            page.drawText(`Sheet: ${sheetName}`, { x: 40, y, size: 12, font });
            y -= 24;

            rows.forEach(row => {
              if (y < 40) { page = pdfDoc.addPage(dims); y = dims[1] - 45; }
              const rowStr = row.map(c => String(c ?? '').padEnd(14).slice(0, 14)).join(' | ');
              page.drawText(rowStr.slice(0, 110), { x: 40, y, size: 9, font });
              y -= 14;
            });
          });
          triggerDownload(new Blob([await pdfDoc.save()], { type: 'application/pdf' }), 'PDFSwift_Spreadsheet.pdf');
        }

        // 4. POWERPOINT TO PDF (Text & Slide Outline Parser)
        else if (activeTool.id === 'ppt-to-pdf') {
          const zip = await JSZip.loadAsync(await uploadedFiles[0].arrayBuffer());
          const slideFiles = Object.keys(zip.files).filter(f => f.match(/ppt\/slides\/slide\d+\.xml/)).sort();
          const pdfDoc = await PDFDocument.create();
          const font = await pdfDoc.embedFont(StandardFonts.HelveticaBold);

          for (const slidePath of slideFiles) {
            const xml = await zip.files[slidePath].async('text');
            const matches = [...xml.matchAll(/<a:t>(.*?)<\/a:t>/g)].map(m => m[1]);
            const page = pdfDoc.addPage([841.89, 595.28]);
            let y = 520;
            matches.forEach(txt => {
              if (y > 40) {
                page.drawText(txt.slice(0, 85), { x: 60, y, size: 16, font });
                y -= 28;
              }
            });
          }
          triggerDownload(new Blob([await pdfDoc.save()], { type: 'application/pdf' }), 'PDFSwift_Presentation.pdf');
        }

        // 5. PDF TO IMAGES
        else if (activeTool.id === 'pdf-to-img') {
          const format = document.getElementById('opt-img-format').value;
          const scale = parseFloat(document.getElementById('opt-dpi').value);
          const ext = format.split('/')[1];

          const buf = await uploadedFiles[0].arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
          const targetPages = parsePageRanges(document.getElementById('opt-page-filter').value, pdf.numPages);

          const zip = new JSZip();
          for (const p of targetPages) {
            const page = await pdf.getPage(p);
            const viewport = page.getViewport({ scale });
            const canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

            const blob = await new Promise(res => canvas.toBlob(res, format, 0.92));
            if (targetPages.length === 1) {
              triggerDownload(blob, `Page_${p}.${ext}`);
              log.textContent = 'Done!';
              return;
            }
            zip.file(`Page_${p}.${ext}`, blob);
          }
          triggerDownload(await zip.generateAsync({ type: 'blob' }), 'PDFSwift_Images.zip');
        }

        // 6. PDF TO WORD (.docx)
        else if (activeTool.id === 'pdf-to-word') {
          const buf = await uploadedFiles[0].arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
          const children = [];

          for (let p = 1; p <= pdf.numPages; p++) {
            const page = await pdf.getPage(p);
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map(i => i.str).join(' ').trim();

            if (pageText.length > 0) {
              children.push(new docx.Paragraph({ text: pageText }));
            } else {
              // Scanned page fallback: embed high-res snapshot
              const vp = page.getViewport({ scale: 1.5 });
              const canvas = document.createElement('canvas');
              canvas.width = vp.width;
              canvas.height = vp.height;
              await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
              const imgBlob = await new Promise(r => canvas.toBlob(r, 'image/png'));
              children.push(new docx.Paragraph({
                children: [new docx.ImageRun({ data: await imgBlob.arrayBuffer(), transformation: { width: 500, height: 650 } })]
              }));
            }
          }
          const doc = new docx.Document({ sections: [{ children }] });
          triggerDownload(await docx.Packer.toBlob(doc), 'PDFSwift_Converted.docx');
        }

        // 7. PDF TO EXCEL (.xlsx)
        else if (activeTool.id === 'pdf-to-excel') {
          const sheets = await extractRowsFromPdf(uploadedFiles[0]);
          const wb = XLSX.utils.book_new();
          sheets.forEach(s => {
            const ws = XLSX.utils.aoa_to_sheet(s.rows);
            XLSX.utils.book_append_sheet(wb, ws, s.name);
          });
          const wbOut = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
          triggerDownload(new Blob([wbOut], { type: 'application/octet-stream' }), 'PDFSwift_Tables.xlsx');
        }

        // 8. PDF TO POWERPOINT (.pptx)
        else if (activeTool.id === 'pdf-to-ppt') {
          const buf = await uploadedFiles[0].arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
          const pptx = new PptxGenJS();

          for (let p = 1; p <= pdf.numPages; p++) {
            const page = await pdf.getPage(p);
            const vp = page.getViewport({ scale: 2 });
            const canvas = document.createElement('canvas');
            canvas.width = vp.width;
            canvas.height = vp.height;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;

            const slide = pptx.addSlide();
            slide.addImage({ data: canvas.toDataURL('image/png'), x: 0, y: 0, w: '100%', h: '100%' });
          }
          await pptx.writeFile({ fileName: 'PDFSwift_Slides.pptx' });
        }

        // 9. MERGE PDFs
        else if (activeTool.id === 'merge-pdf') {
          const mergedPdf = await PDFDocument.create();
          for (const file of uploadedFiles) {
            const srcPdf = await PDFDocument.load(await file.arrayBuffer());
            const copiedPages = await mergedPdf.copyPages(srcPdf, srcPdf.getPageIndices());
            copiedPages.forEach(page => mergedPdf.addPage(page));
          }
          triggerDownload(new Blob([await mergedPdf.save()], { type: 'application/pdf' }), 'PDFSwift_Merged.pdf');
        }

        // 10. SPLIT PDF
        else if (activeTool.id === 'split-pdf') {
          const srcPdf = await PDFDocument.load(await uploadedFiles[0].arrayBuffer());
          const total = srcPdf.getPageCount();
          const mode = document.getElementById('opt-split-mode').value;
          const param = document.getElementById('opt-split-param').value;
          const zip = new JSZip();

          let groups = [];
          if (mode === 'every') {
            groups = Array.from({ length: total }, (_, i) => [i]);
          } else if (mode === 'interval') {
            const step = Math.max(1, parseInt(param, 10) || 1);
            for (let i = 0; i < total; i += step) {
              groups.push(Array.from({ length: Math.min(step, total - i) }, (_, k) => i + k));
            }
          } else {
            param.split(',').forEach(r => {
              const pages = parsePageRanges(r, total).map(p => p - 1);
              if (pages.length) groups.push(pages);
            });
          }

          for (let g = 0; g < groups.length; g++) {
            const newPdf = await PDFDocument.create();
            const copied = await newPdf.copyPages(srcPdf, groups[g]);
            copied.forEach(p => newPdf.addPage(p));
            zip.file(`Split_Part_${g + 1}.pdf`, await newPdf.save());
          }
          triggerDownload(await zip.generateAsync({ type: 'blob' }), 'PDFSwift_Split.zip');
        }

        // 11. REMOVE PAGES
        else if (activeTool.id === 'remove-pages') {
          const srcPdf = await PDFDocument.load(await uploadedFiles[0].arrayBuffer());
          const newPdf = await PDFDocument.create();
          const keepIndices = srcPdf.getPageIndices().filter(idx => !selectedPageIndices.has(idx + 1));
          const copied = await newPdf.copyPages(srcPdf, keepIndices);
          copied.forEach(p => newPdf.addPage(p));
          triggerDownload(new Blob([await newPdf.save()], { type: 'application/pdf' }), 'PDFSwift_Cleaned.pdf');
        }

        // 12. EXTRACT PAGES
        else if (activeTool.id === 'extract-pages') {
          if (!selectedPageIndices.size) {
            alert('Please click at least one page thumbnail to extract.');
            log.textContent = '';
            return;
          }
          const srcPdf = await PDFDocument.load(await uploadedFiles[0].arrayBuffer());
          const mode = document.getElementById('opt-extract-mode').value;
          const sortedPages = Array.from(selectedPageIndices).sort((a, b) => a - b);

          if (mode === 'combined') {
            const newPdf = await PDFDocument.create();
            const copied = await newPdf.copyPages(srcPdf, sortedPages.map(p => p - 1));
            copied.forEach(p => newPdf.addPage(p));
            triggerDownload(new Blob([await newPdf.save()], { type: 'application/pdf' }), 'PDFSwift_Extracted.pdf');
          } else {
            const zip = new JSZip();
            for (const p of sortedPages) {
              const singlePdf = await PDFDocument.create();
              const [copied] = await singlePdf.copyPages(srcPdf, [p - 1]);
              singlePdf.addPage(copied);
              zip.file(`Extracted_Page_${p}.pdf`, await singlePdf.save());
            }
            triggerDownload(await zip.generateAsync({ type: 'blob' }), 'PDFSwift_Extracted_Pages.zip');
          }
        }

        log.textContent = '✓ Completed locally on your device.';
      } catch (err) {
        console.error(err);
        log.textContent = `Error: ${err.message}`;
      }
    });

    // Boot App
    renderSidebar();
  </script>
</body>
</html>
